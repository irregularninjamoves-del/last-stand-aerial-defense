<!DOCTYPE html>

<script>
'use strict';
// ============================================================================
// LAST STAND: Aerial Defense — procedurally generated side-scrolling shooter roguelike
// Single-file canvas game. No dependencies.
// ============================================================================
const W = 1280, H = 720;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', fitCanvas); fitCanvas();

// ---------------------------------------------------------------- sprites (optional art; vector fallback when a file is missing)
// Put PNGs in img/ (authored at 2x). SPR.get('player') returns an Image once loaded, else null -> caller draws vector.
const SPR = (() => {
  const cache = {}, state = {};
  const FILES = { player: 'img/player.png', drone: 'img/drone.png', bomber: 'img/bomber.png', bomber_open: 'img/bomber_open.png', interceptor: 'img/interceptor.png', cannon: 'img/cannon.png', cannon_fire: 'img/cannon_fire.png', swarm: 'img/swarm.png', swarm_up: 'img/swarm_up.png', boss: 'img/boss_mothership.png', boss_armed: 'img/boss_armed.png', boss_damaged: 'img/boss_damaged.png', boss_prime: 'img/boss_prime.png', boss_prime_armed: 'img/boss_prime_armed.png', boss_prime_damaged: 'img/boss_prime_damaged.png', b_assault: 'img/b_assault.png', b_laser: 'img/b_laser.png', b_plasma: 'img/b_plasma.png', b_grenade: 'img/b_grenade.png', e_orange: 'img/e_orange.png', e_pink: 'img/e_pink.png', e_violet: 'img/e_violet.png', e_red: 'img/e_red.png', pk_health: 'img/pk_health.png', pk_laser: 'img/pk_laser.png', pk_plasma: 'img/pk_plasma.png', pk_grenade: 'img/pk_grenade.png', pk_rail: 'img/pk_rail.png', pk_beam: 'img/pk_beam.png', mine: 'img/mine.png', mine_on: 'img/mine_on.png', debris_a: 'img/debris_a.png', debris_b: 'img/debris_b.png', debris_c: 'img/debris_c.png', crate: 'img/crate.png' };
  for (const b of ['coastal', 'urban', 'mountain', 'desert', 'orbital']) for (const l of ['far', 'mid', 'near']) FILES['bg_' + b + '_' + l] = 'img/bg_' + b + '_' + l + '.png';
  function get(id) {
    if (state[id] === 'ok') return cache[id];
    if (state[id] === undefined && FILES[id]) { state[id] = 'loading'; const im = new Image(); im.onload = () => { cache[id] = im; state[id] = 'ok'; }; im.onerror = () => { state[id] = 'missing'; }; im.src = FILES[id]; }
    return null;
  }
  // draw sprite centered at (0,0) in the current transform, scaled so its height (in 1x units) == h; returns true if drawn
  function draw(id, h, opts = {}) { const im = get(id); if (!im) return false; const s = h / (im.height / 2); const w = im.width / 2 * s; ctx.drawImage(im, -w / 2 + (opts.ox || 0), -h / 2 + (opts.oy || 0), w, h); return true; }
  // tile an image horizontally at 1:1 scale, given a scroll offset (0..img.width) and the y of its TOP edge
  function tile(id, off, y, alpha = 1) { const im = get(id); if (!im) return false; const w = im.width; let x = -((off % w) + w) % w; ctx.globalAlpha = alpha; for (; x < W; x += w) ctx.drawImage(im, x, y); ctx.globalAlpha = 1; return true; }
  // is the image opaque at its top-left? (far layers that carry their own sky) — cached
  const opaque = {};
  function isOpaque(id) { const im = get(id); if (!im) return false; if (opaque[id] !== undefined) return opaque[id]; const c = document.createElement('canvas'); c.width = 4; c.height = 4; const x = c.getContext('2d'); x.drawImage(im, 0, 0, 4, 4, 0, 0, 4, 4); const d = x.getImageData(0, 0, 1, 1).data; opaque[id] = d[3] > 250 ? 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')' : false; return opaque[id]; }
  const bottoms = {};
  function bottomColor(id) { const im = get(id); if (!im) return null; if (bottoms[id] !== undefined) return bottoms[id]; const c = document.createElement('canvas'); c.width = 8; c.height = 1; const x = c.getContext('2d'); x.drawImage(im, 0, im.height - 2, im.width, 1, 0, 0, 8, 1); let r = 0, g = 0, b = 0, n = 0; const d = x.getImageData(0, 0, 8, 1).data; for (let i = 0; i < 8; i++) if (d[i * 4 + 3] > 200) { r += d[i * 4]; g += d[i * 4 + 1]; b += d[i * 4 + 2]; n++; } bottoms[id] = n >= 4 ? 'rgb(' + Math.round(r / n) + ',' + Math.round(g / n) + ',' + Math.round(b / n) + ')' : null; return bottoms[id]; }
  return { get, draw, tile, isOpaque, bottomColor, FILES };
})();

// ---------------------------------------------------------------- utils
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function mulberry(seed) { return function () { let t = seed += 0x6D2B79F5; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function fmtTime(s) { s = Math.floor(s); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// ---------------------------------------------------------------- input
const keys = {}, pressed = {};
const mouse = { x: W / 2, y: H / 2, down: false, clicked: false };
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  Audio.unlock();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
// never leave keys stuck when focus leaves the page (alt-tab, clicking outside, tab hidden)
const releaseAll = () => { for (const k in keys) keys[k] = false; };
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
canvas.tabIndex = 0; canvas.style.outline = 'none';
canvas.addEventListener('pointerdown', () => canvas.focus());
window.addEventListener('load', () => canvas.focus());
function canvasPos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
canvas.addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; });
canvas.addEventListener('mousedown', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true; mouse.clicked = true; Audio.unlock(); });
window.addEventListener('mouseup', () => { mouse.down = false; });

// ---------------------------------------------------------------- touch / mobile
const MOBILE = { ui: (navigator.maxTouchPoints > 0 && matchMedia('(pointer: coarse)').matches), seen: false };
const TOUCH = { active: false, id: null, ox: 0, oy: 0, cx: 0, cy: 0, ax: 0, ay: 0, radius: 56, follow: 1.7 };
let touchButtons = [];        // rebuilt each frame by drawTouchControls: {x,y,r,code,label,...}
const heldTouchIds = {};      // touch id -> button code (for release)
function touchPos(t) { const r = canvas.getBoundingClientRect(); return { x: (t.clientX - r.left) * W / r.width, y: (t.clientY - r.top) * H / r.height }; }
function hitTouchButton(x, y) { for (const b of touchButtons) if (dist(x, y, b.x, b.y) <= b.r + 8) return b; return null; }
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function goFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!document.fullscreenElement && !document.webkitFullscreenElement && req) { try { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => { }); } catch (e) { } }
  const so = window.screen && window.screen.orientation;
  if (so && so.lock) so.lock('landscape').catch(() => { });
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); MOBILE.ui = true; MOBILE.seen = true; Audio.unlock();
  for (const t of e.changedTouches) {
    const p = touchPos(t);
    if (screen !== 'play') { mouse.x = p.x; mouse.y = p.y; mouse.clicked = true; continue; }
    const b = hitTouchButton(p.x, p.y);
    if (b) { pressed[b.code] = true; keys[b.code] = true; heldTouchIds[t.identifier] = b.code; continue; }
    if (!TOUCH.active) { TOUCH.active = true; TOUCH.id = t.identifier; TOUCH.ox = TOUCH.cx = p.x; TOUCH.oy = TOUCH.cy = p.y; TOUCH.ax = TOUCH.ay = 0; }
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (TOUCH.active && t.identifier === TOUCH.id) {
      const p = touchPos(t); TOUCH.cx = p.x; TOUCH.cy = p.y;
      let dx = p.x - TOUCH.ox, dy = p.y - TOUCH.oy; const d = Math.hypot(dx, dy);
      // base only follows once the thumb drifts well past the rim, so direction reversals respond instantly
      if (d > TOUCH.radius * TOUCH.follow) { const keep = TOUCH.radius * TOUCH.follow; TOUCH.ox = p.x - dx / d * keep; TOUCH.oy = p.y - dy / d * keep; }
      const dead = 4; const m = Math.pow(clamp((d - dead) / (TOUCH.radius - dead), 0, 1), 0.75); // quick ramp, saturates at rim
      TOUCH.ax = d > dead ? clamp(dx / d * m, -1, 1) : 0; TOUCH.ay = d > dead ? clamp(dy / d * m, -1, 1) : 0;
      if (mouse) { mouse.x = p.x; mouse.y = p.y; }
    }
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  if (e.type === 'touchend' && !document.fullscreenElement && screen !== 'play') goFullscreen();
  for (const t of e.changedTouches) {
    if (TOUCH.active && t.identifier === TOUCH.id) { TOUCH.active = false; TOUCH.ax = TOUCH.ay = 0; }
    if (heldTouchIds[t.identifier]) { keys[heldTouchIds[t.identifier]] = false; delete heldTouchIds[t.identifier]; }
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

// ---------------------------------------------------------------- audio (procedural WebAudio)
const Audio = (() => {
  let ac = null, master = null, muted = false, ambGain = null, ambSrc = null, ambType = null;
  function unlock() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.35; master.connect(ac.destination);
    } catch (e) { ac = null; }
  }
  function tone(freq, dur, type = 'square', vol = 0.3, slide = 0) {
    if (!ac || muted) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, ac.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), ac.currentTime + dur);
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime + dur);
  }
  let noiseBuf = null;
  function noise(dur, vol = 0.3, lp = 1200) {
    if (!ac || muted) return;
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(ac.currentTime + dur);
  }
  function ambience(type) {
    if (!ac) return;
    if (ambType === type) return;
    ambType = type;
    if (ambSrc) { try { ambSrc.stop(); } catch (e) { } ambSrc = null; }
    if (type === 'none' || muted) return;
    if (!noiseBuf) noise(0.01, 0.0001);
    ambSrc = ac.createBufferSource(); ambSrc.buffer = noiseBuf; ambSrc.loop = true;
    const f = ac.createBiquadFilter(); f.type = type === 'sand' ? 'bandpass' : 'lowpass'; f.frequency.value = type === 'storm' ? 900 : type === 'sand' ? 600 : 2500;
    ambGain = ac.createGain(); ambGain.gain.value = type === 'storm' ? 0.18 : type === 'rain' ? 0.1 : 0.12;
    ambSrc.connect(f); f.connect(ambGain); ambGain.connect(master); ambSrc.start();
  }
  const sfx = {
    shoot: () => tone(880, 0.05, 'square', 0.06, -400),
    laser: () => tone(1400, 0.08, 'sawtooth', 0.07, -900),
    grenade: () => tone(200, 0.15, 'square', 0.15, -120),
    rail: () => { tone(120, 0.3, 'sawtooth', 0.2, 900); noise(0.2, 0.15, 3000); },
    plasma: () => tone(600, 0.12, 'sine', 0.1, 300),
    hit: () => tone(300, 0.04, 'triangle', 0.08, -100),
    boom: () => { noise(0.4, 0.4, 800); tone(90, 0.4, 'sine', 0.3, -60); },
    bigboom: () => { noise(1.2, 0.6, 500); tone(60, 1.0, 'sine', 0.5, -40); },
    hurt: () => { tone(160, 0.2, 'sawtooth', 0.25, -80); noise(0.15, 0.2, 900); },
    pickup: () => { tone(660, 0.08, 'sine', 0.2); setTimeout(() => tone(990, 0.12, 'sine', 0.2), 70); },
    levelup: () => { // rising arp + shimmer tail (ducks music briefly)
      Music.duck(1.2);
      [0, 4, 7, 12, 16, 19, 24].forEach((st, i) => setTimeout(() => { const f = 440 * Math.pow(2, st / 12); tone(f, 0.35, 'triangle', 0.22); tone(f * 2, 0.5, 'sine', 0.08); }, i * 70));
      setTimeout(() => { tone(880, 0.9, 'sine', 0.15); tone(1108.7, 0.9, 'sine', 0.12); tone(1318.5, 0.9, 'sine', 0.1); noise(0.6, 0.06, 6000); }, 520);
    },
    tele: () => tone(220, 0.25, 'sawtooth', 0.08, 220),
    thunder: () => { noise(1.5, 0.7, 300); tone(50, 1.2, 'sine', 0.4, -30); },
    dash: () => tone(500, 0.15, 'sine', 0.15, 700),
    shield: () => tone(400, 0.3, 'triangle', 0.2, -200),
    weld: () => { tone(300, 0.3, 'sine', 0.2, 300); },
    warn: () => { tone(440, 0.15, 'square', 0.15); setTimeout(() => tone(440, 0.15, 'square', 0.15), 200); },
    reload: () => tone(500, 0.06, 'square', 0.08, -200),
    nuke: () => { tone(1800, 0.5, 'sine', 0.2, -1700); setTimeout(() => { noise(2.2, 0.9, 400); tone(38, 2.4, 'sine', 0.7, -20); tone(55, 1.2, 'triangle', 0.4, -30); }, 120); setTimeout(() => noise(1.6, 0.35, 1800), 500); },
    comboTick: n => tone(440 * Math.pow(2, n / 12), 0.07, 'square', 0.09, 200),
    milestone: () => { [0, 7, 12, 19, 24].forEach((st, i) => setTimeout(() => tone(523 * Math.pow(2, st / 12), 0.22, 'square', 0.16), i * 45)); noise(0.3, 0.12, 5000); },
    unlock: () => { [392, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sine', 0.22), i * 80)); },
  };
  return { unlock, sfx, ambience, toggle() { muted = !muted; if (muted && ambSrc) { try { ambSrc.stop(); } catch (e) { } ambSrc = null; ambType = null; } Music.setMuted(muted); return muted; }, get muted() { return muted; }, get ac() { return ac; }, get master() { return master; } };
})();

// ---------------------------------------------------------------- music ('90s jazz-fusion sequencer)
// Dorian vamps, electric-piano comping, analog-style synth leads & pads, fingered bass, fusion drums (ride, ghost notes).
// Tracks: title, level0..2 (rotate per level), boss.  Drop real files at music/<name>.mp3 to override any track:
//   music/title.mp3  music/boss.mp3  music/level1.mp3  music/level2.mp3  music/level3.mp3
const Music = (() => {
  const FILES = { title: 'music/title.mp3', boss: 'music/boss.mp3', level0: 'music/level1.mp3', level1: 'music/level2.mp3', level2: 'music/level3.mp3' };
  const fileOk = {};
  let bus = null, comp = null, delay = null, dGain = null, verb = null, vGain = null, noiseBuf = null;
  let cur = null, curName = null, el = null, timer = null, step = 0, nextT = 0, vol = 0.55, muted = false, enabled = true, wantName = null;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);
  const DORIAN = [0, 2, 3, 5, 7, 9, 10];
  // chord = scale degree (0-based) of the Dorian mode; voicings built from stacked thirds in-scale (7th/9th chords)
  // comp = comping rhythm patterns: [step, lengthSteps]; alternate per bar
  const COMPS = {
    laid: [[[0, 3], [6, 2], [10, 4]], [[2, 2], [6, 3], [12, 3]], [[0, 3], [7, 2], [11, 2], [14, 2]], [[3, 3], [8, 2], [12, 4]]],
    push: [[[0, 2], [3, 2], [7, 3], [11, 2], [14, 2]], [[1, 2], [6, 2], [10, 2], [13, 3]], [[0, 2], [4, 3], [8, 2], [11, 2], [14, 2]], [[2, 2], [7, 2], [10, 3], [14, 2]]],
    ballad: [[[0, 8], [8, 8]], [[0, 6], [6, 4], [10, 6]]],
  };
  const TRACKS = {
    // ---- title: slow, warm, EP-driven Dorian vamp (D dorian)  i7 - IV7 - i7 - bVII
    title: { bpm: 84, root: 50, prog: [0, 3, 0, 6, 0, 3, 1, 4], comp: 'ballad', bars: 8, drums: 'brush', bassStyle: 'long', lead: { on: [3, 7], type: 'sine', vib: 5, cutoff: 1500, oct: 2, density: 0.35 }, pad: true, ep: true, feel: 0.0 },
    // ---- level 0: mid-tempo fusion groove (A dorian)  i7 - IV7 - i7 - IV7 | ii7 - IV7 - i7 - bVII
    level0: { bpm: 108, root: 57, prog: [0, 3, 0, 3, 1, 3, 0, 6], comp: 'laid', bars: 8, drums: 'fusion', bassStyle: 'funk', lead: { on: [2, 3, 6, 7], type: 'sawtooth', vib: 5.5, cutoff: 2600, oct: 2, density: 0.5 }, pad: true, ep: true, feel: 0.12 },
    // ---- level 1: brighter, faster (E dorian) i - IV - v - IV | i - bIII - IV - i
    level1: { bpm: 118, root: 52, prog: [0, 3, 4, 3, 0, 2, 3, 0], comp: 'push', bars: 8, drums: 'fusionB', bassStyle: 'funk', lead: { on: [1, 2, 3, 5, 6, 7], type: 'square', vib: 6, cutoff: 3000, oct: 2, density: 0.55 }, pad: false, ep: true, feel: 0.1 },
    // ---- level 2: modal, spacious (G dorian) i - ii - IV - i | i - IV - bVII - IV
    level2: { bpm: 100, root: 55, prog: [0, 1, 3, 0, 0, 3, 6, 3], comp: 'laid', bars: 8, drums: 'fusion', bassStyle: 'walk', lead: { on: [2, 3, 6, 7], type: 'triangle', vib: 5, cutoff: 2200, oct: 2, density: 0.45 }, pad: true, ep: true, feel: 0.14 },
    // ---- boss: driving fusion, minor-heavy Dorian (C# dorian) i - bVII - i - IV | i - ii - bIII - bVII
    boss: { bpm: 132, root: 49, prog: [0, 6, 0, 3, 0, 1, 2, 6], comp: 'push', bars: 8, drums: 'drive', bassStyle: 'funk', lead: { on: [0, 1, 2, 3, 4, 5, 6, 7], type: 'sawtooth', vib: 7, cutoff: 3600, oct: 2, density: 0.65, dist: true }, pad: true, ep: true, feel: 0.06 },
  };
  // fusion drum kits: 16-step patterns, chars: K=kick, S=snare, g=ghost snare, r=ride, R=ride bell, h=closed hat, o=open hat, .=rest (one string per voice)
  const KITS = {
    brush: [{ k: 'x.......x.......', s: '....s.......s...', r: 'r.r.r.r.r.r.r.r.', h: '................' }],
    fusion: [
      { k: 'x..x..x...x..x..', s: '....S..g..g.S...', r: 'r.r.r.rRr.r.r.rR', h: '..h...h...h...h.' },
      { k: 'x..x....x.x.....', s: '....S.g...g.S..g', r: 'r.r.r.r.r.r.r.rR', h: '..h...h...h...h.' },
      { k: 'x..x..x...x.....', s: '....S..g..g.S...', r: 'r.rRr.r.r.rRr.r.', h: '..h...h...h...h.' },
      { k: 'x..x..x.x.x..x..', s: '....S..g.g..S.gg', r: 'r.r.r.r.r.r.r.r.', h: '..h...h...h...ho' }],
    fusionB: [
      { k: 'x...x..x..x.....', s: '....S..g..g.S...', r: 'rrrrrrrrrrrrrrrr', h: '..h...h...h...h.' },
      { k: 'x...x..x..x..x..', s: '....S.g.g...S.g.', r: 'r.rRr.r.r.rRr.r.', h: '..h...h...h...h.' },
      { k: 'x..x..x...x..x..', s: '....S..g..g.S...', r: 'rrrrrrrrrrrrrrrr', h: '..h...h...h...h.' },

function pickWeather(theme) {
  let list = WEATHERS.map(w => ({ ...w }));
  if (theme.sandBias) list.find(w => w.id === 'sand').w = 40;
  if (theme.space) return WEATHERS[0]; // orbital: no weather up here
  const total = list.reduce((s, w) => s + w.w, 0);
  let r = G.rng() * total;
  for (const w of list) { r -= w.w; if (r <= 0) return w; }
  return list[0];
}

function buildPlan(idx) {
